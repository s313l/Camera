<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Detector with Telegram Alerts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #00ff41;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid #00ff41;
            padding: 15px 20px;
            box-shadow: 0 4px 15px rgba(0, 255, 65, 0.2);
        }

        .header h1 {
            font-size: 24px;
            text-shadow: 0 0 10px #00ff41;
            letter-spacing: 2px;
        }

        .container {
            display: flex;
            flex: 1;
            gap: 20px;
            padding: 20px;
            max-height: calc(100vh - 80px);
        }

        .video-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .video-container {
            position: relative;
            width: 100%;
            flex: 1;
            background: #000;
            border: 2px solid #00ff41;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .controls {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #00ff41;
            border-radius: 8px;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00ff41;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #1a1f3a;
            border-radius: 3px;
            appearance: none;
            -webkit-appearance: none;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00ff41;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.6);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00ff41;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.6);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
            box-shadow: 0 0 8px currentColor;
        }

        .status-dot.idle {
            background: #00ff41;
            color: #00ff41;
        }

        .status-dot.active {
            background: #ff0000;
            color: #ff0000;
            animation: pulse-fast 0.5s infinite;
        }

        .status-dot.sending {
            background: #ffa500;
            color: #ffa500;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        button {
            padding: 10px 20px;
            background: #00ff41;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }

        button:hover {
            background: #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.6);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.98);
        }

        button.stop {
            background: #ff0000;
            color: white;
        }

        button.stop:hover {
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .sidebar {
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff41;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
        }

        .panel h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            border-bottom: 1px solid #00ff41;
            padding-bottom: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 12px;
        }

        .stat {
            background: rgba(0, 255, 65, 0.1);
            padding: 10px;
            border-radius: 4px;
            border-left: 3px solid #00ff41;
        }

        .stat-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #00ff41;
            margin-top: 4px;
        }

        .log-container {
            flex: 1;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ff41;
            border-radius: 4px;
            padding: 10px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            max-height: 300px;
        }

        .log-entry {
            padding: 6px 0;
            border-bottom: 1px solid rgba(0, 255, 65, 0.2);
            word-break: break-all;
            animation: slideIn 0.3s ease;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-entry.info {
            color: #00ff41;
        }

        .log-entry.warning {
            color: #ffa500;
        }

        .log-entry.error {
            color: #ff0000;
        }

        .log-entry.success {
            color: #00ff41;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .toggle-switch {
            display: inline-flex;
            align-items: center;
            width: 50px;
            height: 26px;
            background: #333;
            border-radius: 13px;
            cursor: pointer;
            position: relative;
            transition: background 0.3s;
            border: 1px solid #00ff41;
        }

        .toggle-switch.on {
            background: #00ff41;
        }

        .toggle-switch-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 22px;
            height: 22px;
            background: #000;
            border-radius: 50%;
            transition: left 0.3s;
        }

        .toggle-switch.on .toggle-switch-slider {
            left: 26px;
        }

        .warning-banner {
            background: rgba(255, 165, 0, 0.2);
            border: 1px solid #ffa500;
            border-radius: 4px;
            padding: 8px;
            font-size: 10px;
            color: #ffa500;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 1200px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
        }

        /* Scrollbar styling */
        .log-container::-webkit-scrollbar {
            width: 8px;
        }

        .log-container::-webkit-scrollbar-track {
            background: rgba(0, 255, 65, 0.1);
            border-radius: 4px;
        }

        .log-container::-webkit-scrollbar-thumb {
            background: #00ff41;
            border-radius: 4px;
        }

        .motion-regions {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎥 MOTION DETECTOR - TELEGRAM ALERT SYSTEM</h1>
    </div>

    <div class="container">
        <div class="video-section">
            <div class="video-container">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
            </div>
            <div class="controls">
                <div class="control-group">
                    <label for="sensitivity">Motion Sensitivity</label>
                    <input type="range" id="sensitivity" min="5" max="50" value="20" step="1">
                    <span id="sensitivityValue">20%</span>
                </div>
                <div class="control-group">
                    <label for="cooldown">Cooldown (seconds)</label>
                    <input type="range" id="cooldown" min="5" max="60" value="30" step="5">
                    <span id="cooldownValue">30s</span>
                </div>
                <div class="control-group">
                    <button id="startBtn">START MONITORING</button>
                </div>
                <div class="control-group">
                    <div class="status-indicator">
                        <div class="status-dot idle" id="statusDot"></div>
                        <span id="statusText">IDLE</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <h3>⚙️ System Status</h3>
                <div class="stats-grid">
                    <div class="stat">
                        <div class="stat-label">FPS</div>
                        <div class="stat-value" id="fpsValue">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Motion Events</div>
                        <div class="stat-value" id="motionCount">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Alerts Sent</div>
                        <div class="stat-value" id="alertCount">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Video Recording</div>
                        <div class="stat-value" id="recordingState">OFF</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3>📡 Telegram Configuration</h3>
                <div style="font-size: 10px; color: #888; margin-bottom: 10px;">
                    ✓ Bot Connected<br>
                    ✓ Chat ID: 6785437506
                </div>
                <div class="warning-banner">
                    ⚠️ CLIENT-SIDE TOKEN VISIBLE<br>
                    FOR LOCAL USE ONLY
                </div>
            </div>

            <div class="panel">
                <h3>📋 Event Log</h3>
                <div class="log-container" id="logContainer"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION (HARDCODED)
        // WARNING: Client-side tokens are visible in source code. 
        // Use for local personal projects only.
        // ============================================
        const CONFIG = {
            BOT_TOKEN: '8084431818:AAEPTRFWDjOWM9T7AQALPf_s0zCVWbM8M_A',
            CHAT_ID: '6785437506',
            TELEGRAM_API_BASE: 'https://api.telegram.org/bot',
            VIDEO_DURATION: 8000, // 8 seconds
            CANVAS_WIDTH: 640,
            CANVAS_HEIGHT: 480
        };

        // ============================================
        // STATE MANAGEMENT
        // ============================================
        let state = {
            isMonitoring: false,
            isRecording: false,
            lastMotionTime: 0,
            motionEventCount: 0,
            alertSentCount: 0,
            sensitivity: 20,
            cooldownSeconds: 30,
            fps: 0,
            frameCount: 0,
            lastFpsTime: Date.now(),
            mediaRecorder: null,
            recordedChunks: [],
            videoStream: null,
            canvasContext: null
        };

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const elements = {
            video: document.getElementById('video'),
            canvas: document.getElementById('canvas'),
            startBtn: document.getElementById('startBtn'),
            sensitivitySlider: document.getElementById('sensitivity'),
            sensitivityValue: document.getElementById('sensitivityValue'),
            cooldownSlider: document.getElementById('cooldown'),
            cooldownValue: document.getElementById('cooldownValue'),
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            logContainer: document.getElementById('logContainer'),
            fpsValue: document.getElementById('fpsValue'),
            motionCount: document.getElementById('motionCount'),
            alertCount: document.getElementById('alertCount'),
            recordingState: document.getElementById('recordingState')
        };

        // ============================================
        // LOGGING SYSTEM
        // ============================================
        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.textContent = `[${timestamp}] ${message}`;
            elements.logContainer.appendChild(logEntry);
            elements.logContainer.scrollTop = elements.logContainer.scrollHeight;
            
            // Keep only last 50 entries
            while (elements.logContainer.children.length > 50) {
                elements.logContainer.removeChild(elements.logContainer.firstChild);
            }
            
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        // ============================================
        // MOTION DETECTION ENGINE
        // ============================================
        class MotionDetector {
            constructor(canvas, videoElement) {
                this.canvas = canvas;
                this.video = videoElement;
                this.ctx = canvas.getContext('2d', { willReadFrequently: true });
                this.prevImageData = null;
                this.motionRegions = [];
            }

            resize(width, height) {
                this.canvas.width = width;
                this.canvas.height = height;
            }

            detect(sensitivity) {
                // Draw current video frame to canvas
                this.ctx.drawImage(this.video, 0, 0, this.canvas.width, this.canvas.height);
                const currentImageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                const currentData = currentImageData.data;

                this.motionRegions = [];

                if (!this.prevImageData) {
                    this.prevImageData = currentImageData;
                    return { hasMotion: false, regions: [] };
                }

                const prevData = this.prevImageData.data;
                const threshold = sensitivity;
                let motionPixelCount = 0;
                const totalPixels = currentData.length / 4;

                // Pixel-by-pixel difference algorithm
                for (let i = 0; i < currentData.length; i += 4) {
                    const rDiff = Math.abs(currentData[i] - prevData[i]);
                    const gDiff = Math.abs(currentData[i + 1] - prevData[i + 1]);
                    const bDiff = Math.abs(currentData[i + 2] - prevData[i + 2]);
                    
                    const avgDiff = (rDiff + gDiff + bDiff) / 3;

                    if (avgDiff > threshold) {
                        motionPixelCount++;
                        // Mark motion pixel on canvas overlay
                        currentImageData.data[i + 3] = 100; // Adjust alpha for visualization
                    }
                }

                const motionPercentage = (motionPixelCount / totalPixels) * 100;
                const hasMotion = motionPercentage > 2; // More than 2% of pixels changed

                if (hasMotion) {
                    // Draw bounding boxes around motion regions (simplified)
                    this.drawMotionVisualization();
                }

                this.prevImageData = currentImageData;
                return { 
                    hasMotion, 
                    motionPercentage,
                    regions: this.motionRegions 
                };
            }

            drawMotionVisualization() {
                // Draw a red border to indicate motion detected
                this.ctx.strokeStyle = '#00ff00';
                this.ctx.lineWidth = 3;
                this.ctx.strokeRect(5, 5, this.canvas.width - 10, this.canvas.height - 10);
            }

            clear() {
                this.prevImageData = null;
            }
        }

        let motionDetector = null;

        // ============================================
        // VIDEO CAPTURE
        // ============================================
        async function initializeCamera() {
            try {
                const constraints = {
                    video: {
                        width: { ideal: CONFIG.CANVAS_WIDTH },
                        height: { ideal: CONFIG.CANVAS_HEIGHT },
                        facingMode: 'user'
                    },
                    audio: false
                };

                state.videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                elements.video.srcObject = state.videoStream;

                return new Promise((resolve) => {
                    elements.video.onloadedmetadata = () => {
                        const width = elements.video.videoWidth;
                        const height = elements.video.videoHeight;
                        
                        if (motionDetector) motionDetector.resize(width, height);
                        addLog(`Camera initialized: ${width}x${height}`, 'success');
                        resolve();
                    };
                });
            } catch (error) {
                addLog(`Camera permission denied: ${error.message}`, 'error');
                alert('Camera permission required. Please enable camera access.');
                throw error;
            }
        }

        // ============================================
        // TELEGRAM INTEGRATION
        // ============================================
        async function sendImageToTelegram(imageBlob) {
            try {
                addLog('Sending image to Telegram...', 'warning');

                const formData = new FormData();
                formData.append('chat_id', CONFIG.CHAT_ID);
                formData.append('photo', imageBlob, 'motion-detected.jpg');
                formData.append('caption', '🚨 Motion Detected!');

                const response = await fetch(
                    `${CONFIG.TELEGRAM_API_BASE}${CONFIG.BOT_TOKEN}/sendPhoto`,
                    {
                        method: 'POST',
                        body: formData
                    }
                );

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const result = await response.json();
                if (result.ok) {
                    addLog('✓ Image sent to Telegram successfully', 'success');
                    return true;
                } else {
                    throw new Error(result.description);
                }
            } catch (error) {
                addLog(`✗ Failed to send image: ${error.message}`, 'error');
                return false;
            }
        }

        async function sendVideoToTelegram(videoBlob) {
            try {
                addLog('Sending video to Telegram...', 'warning');

                const formData = new FormData();
                formData.append('chat_id', CONFIG.CHAT_ID);
                formData.append('video', videoBlob, 'motion-recorded.mp4');
                formData.append('caption', '📹 Motion Recording');

                const response = await fetch(
                    `${CONFIG.TELEGRAM_API_BASE}${CONFIG.BOT_TOKEN}/sendVideo`,
                    {
                        method: 'POST',
                        body: formData
                    }
                );

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const result = await response.json();
                if (result.ok) {
                    addLog('✓ Video sent to Telegram successfully', 'success');
                    return true;
                } else {
                    throw new Error(result.description);
                }
            } catch (error) {
                addLog(`✗ Failed to send video: ${error.message}`, 'error');
                return false;
            }
        }

        // ============================================
        // MEDIA RECORDING
        // ============================================
        function startVideoRecording() {
            try {
                state.recordedChunks = [];
                
                const options = {
                    mimeType: 'video/webm;codecs=vp9',
                    videoBitsPerSecond: 2500000
                };

                // Fallback for browsers that don't support vp9
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options.mimeType = 'video/webm';
                }

                state.mediaRecorder = new MediaRecorder(state.videoStream, options);

                state.mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        state.recordedChunks.push(e.data);
                    }
                };

                state.mediaRecorder.onstop = async () => {
                    const videoBlob = new Blob(state.recordedChunks, { type: 'video/webm' });
                    state.recordedChunks = [];
                    
                    elements.recordingState.textContent = 'OFF';
                    state.isRecording = false;

                    await sendVideoToTelegram(videoBlob);
                };

                state.mediaRecorder.start();
                state.isRecording = true;
                elements.recordingState.textContent = 'ON';
                addLog('Video recording started', 'info');

                // Auto-stop after specified duration
                setTimeout(() => {
                    if (state.mediaRecorder && state.isRecording) {
                        state.mediaRecorder.stop();
                        addLog('Video recording stopped (duration limit)', 'info');
                    }
                }, CONFIG.VIDEO_DURATION);

            } catch (error) {
                addLog(`Failed to start recording: ${error.message}`, 'error');
            }
        }

        // ============================================
        // IMAGE CAPTURE
        // ============================================
        function captureImage() {
            return new Promise((resolve) => {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = elements.video.videoWidth;
                tempCanvas.height = elements.video.videoHeight;
                const ctx = tempCanvas.getContext('2d');
                ctx.drawImage(elements.video, 0, 0);

                tempCanvas.toBlob((blob) => {
                    resolve(blob);
                }, 'image/jpeg', 0.95);
            });
        }

        // ============================================
        // MOTION ALERT HANDLER
        // ============================================
        async function handleMotionDetected() {
            const now = Date.now();
            const cooldownMs = state.cooldownSeconds * 1000;

            // Check cooldown period
            if (now - state.lastMotionTime < cooldownMs) {
                return;
            }

            state.lastMotionTime = now;
            state.alertSentCount++;
            elements.alertCount.textContent = state.alertSentCount;

            addLog('🚨 MOTION DETECTED - Capturing evidence...', 'warning');
            updateStatus('ALERT', 'sending');

            try {
                // Capture image
                const imageBlob = await captureImage();
                
                // Send image
                await sendImageToTelegram(imageBlob);

                // Start video recording
                startVideoRecording();

            } catch (error) {
                addLog(`Alert handling failed: ${error.message}`, 'error');
            }

            // Reset status after brief delay
            setTimeout(() => {
                if (state.isMonitoring && !state.isRecording) {
                    updateStatus('MONITORING', 'idle');
                }
            }, 2000);
        }

        // ============================================
        // STATUS MANAGEMENT
        // ============================================
        function updateStatus(text, state_type) {
            elements.statusText.textContent = text;
            elements.statusDot.className = `status-dot ${state_type}`;
        }

        // ============================================
        // MONITORING LOOP
        // ============================================
        function startMonitoring() {
            if (state.isMonitoring) return;

            state.isMonitoring = true;
            state.motionEventCount = 0;
            elements.startBtn.textContent = 'STOP MONITORING';
            elements.startBtn.classList.add('stop');
            updateStatus('MONITORING', 'idle');
            addLog('Monitoring started', 'success');
            motionDetector.clear();

            // FPS counter
            setInterval(() => {
                const now = Date.now();
                const delta = now - state.lastFpsTime;
                if (delta >= 1000) {
                    state.fps = Math.round(state.frameCount * 1000 / delta);
                    elements.fpsValue.textContent = state.fps;
                    state.frameCount = 0;
                    state.lastFpsTime = now;
                }
            }, 1000);

            const detectMotion = () => {
                if (!state.isMonitoring) return;

                state.frameCount++;

                const sensitivity = state.sensitivity * 2; // Convert 5-50 to 10-100
                const result = motionDetector.detect(sensitivity);

                if (result.hasMotion) {
                    state.motionEventCount++;
                    elements.motionCount.textContent = state.motionEventCount;

                    handleMotionDetected();
                }

                requestAnimationFrame(detectMotion);
            };

            detectMotion();
        }

        function stopMonitoring() {
            if (!state.isMonitoring) return;

            state.isMonitoring = false;
            elements.startBtn.textContent = 'START MONITORING';
            elements.startBtn.classList.remove('stop');
            updateStatus('STOPPED', 'idle');

            if (state.mediaRecorder && state.isRecording) {
                state.mediaRecorder.stop();
            }

            if (state.videoStream) {
                state.videoStream.getTracks().forEach(track => track.stop());
            }

            addLog('Monitoring stopped', 'info');
        }

        // ============================================
        // UI EVENT LISTENERS
        // ============================================
        elements.startBtn.addEventListener('click', () => {
            if (state.isMonitoring) {
                stopMonitoring();
            } else {
                startMonitoring();
            }
        });

        elements.sensitivitySlider.addEventListener('input', (e) => {
            state.sensitivity = parseInt(e.target.value);
            elements.sensitivityValue.textContent = `${state.sensitivity}%`;
        });

        elements.cooldownSlider.addEventListener('input', (e) => {
            state.cooldownSeconds = parseInt(e.target.value);
            elements.cooldownValue.textContent = `${state.cooldownSeconds}s`;
        });

        // ============================================
        // INITIALIZATION
        // ============================================
        async function initialize() {
            try {
                addLog('System initializing...', 'info');
                
                // Setup motion detector
                state.canvasContext = elements.canvas.getContext('2d', { willReadFrequently: true });
                motionDetector = new MotionDetector(elements.canvas, elements.video);

                // Request camera access
                await initializeCamera();

                addLog('System ready. Click START MONITORING to begin.', 'success');
                updateStatus('READY', 'idle');

            } catch (error) {
                addLog(`Initialization failed: ${error.message}`, 'error');
                elements.startBtn.disabled = true;
            }
        }

        // Start initialization when page loads
        window.addEventListener('load', initialize);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            stopMonitoring();
        });
    </script>
</body>
</html>
