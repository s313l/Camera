<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام كشف الحركة الأمني الاحترافي</title>
    <style>
        :root {
            --bg-primary: #111111;
            --bg-secondary: #1a1a1a;
            --text-primary: #e0e0e0;
            --accent-green: #00ff9d;
            --accent-red: #ff3333;
            --accent-blue: #00a8ff;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--bg-secondary);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        h1 {
            text-align: center;
            color: var(--accent-blue);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Video Container Styling */
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #333;
            background: #000;
            aspect-ratio: 4/3; /* Maintain aspect ratio */
        }

        #mainCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* The raw video feed is hidden, we process it on canvas */
        #sourceVideo {
            display: none;
        }

        /* Overlay for motion detected alert */
        #motionAlertOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 6px solid var(--accent-red);
            box-sizing: border-box;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: inset 0 0 50px var(--accent-red);
        }

        .controls-panel {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--accent-blue);
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent-blue);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        #startBtn { background-color: var(--accent-green); color: #000; }
        #stopBtn { background-color: var(--accent-red); color: #fff; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        #statusLog {
            margin-top: 20px;
            height: 150px;
            overflow-y: auto;
            background: #000;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }

        .log-entry { margin-bottom: 5px; border-left: 3px solid #555; padding-left: 8px; }
        .log-info { border-color: var(--accent-blue); color: var(--accent-blue); }
        .log-alert { border-color: var(--accent-red); color: var(--accent-red); font-weight: bold;}
        .log-success { border-color: var(--accent-green); color: var(--accent-green); }
        
        /* Sensitivty Value Display */
        .val-display { float: left; font-weight: normal; color: #fff;}

    </style>
</head>
<body>

    <div class="container">
        <h1>لوحة التحكم الأمنية</h1>
        
        <div class="video-wrapper">
            <video id="sourceVideo" autoplay playsinline muted></video>
            <canvas id="mainCanvas"></canvas>
            <div id="motionAlertOverlay"></div>
        </div>

        <div class="controls-panel">
            <div class="control-group" style="grid-column: 1 / -1;">
                 <label for="sensitivitySlider">حساسية الحركة (Sensitivity): <span id="sensVal" class="val-display">20</span></label>
                 <input type="range" id="sensitivitySlider" min="5" max="100" value="20" step="1">
                 <small style="color:#999">قيمة أقل = حساسية أعلى (يكتشف حركات أصغر)</small>
            </div>
            <button id="startBtn" class="btn">بدء المراقبة</button>
            <button id="stopBtn" class="btn" disabled>إيقاف</button>
        </div>

        <div id="statusLog"></div>
    </div>

    <script>
        // ==========================================
        // إعدادات تيليجرام (تحذير: مرئية في الكود)
        // ==========================================
        const TELEGRAM_BOT_TOKEN = '8084431818:AAEPTRFWDjOWM9T7AQALPf_s0zCVWbM8M_A';
        const TELEGRAM_CHAT_ID = '6785437506';
        // ==========================================

        // عناصر DOM
        const video = document.getElementById('sourceVideo');
        const mainCanvas = document.getElementById('mainCanvas');
        const mainCtx = mainCanvas.getContext('2d', { willReadFrequently: true });
        const alertOverlay = document.getElementById('motionAlertOverlay');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const sensitivitySlider = document.getElementById('sensitivitySlider');
        const sensValDisplay = document.getElementById('sensVal');
        const statusLog = document.getElementById('statusLog');

        // متغيرات النظام
        let stream = null;
        let isMonitoring = false;
        let isProcessingAlert = false; // لمنع التنبيهات المتكررة أثناء التسجيل
        let mediaRecorder = null;
        let recordedChunks = [];
        let animationId = null;

        // إعدادات الكشف عن الحركة
        let sensitivityThreshold = parseInt(sensitivitySlider.value);
        // نستخدم canvas صغير جداً للمعالجة لتحسين الأداء
        const processCanvas = document.createElement('canvas');
        const processCtx = processCanvas.getContext('2d', { willReadFrequently: true });
        // حجم المعالجة (كلما صغر زاد الأداء وقلت الدقة للتفاصيل الصغيرة)
        const processWidth = 160; 
        const processHeight = 120;
        processCanvas.width = processWidth;
        processCanvas.height = processHeight;
        
        let previousFrameData = null;
        const COOLDOWN_TIME_MS = 8000; // فترة تهدئة بين التنبيهات (8 ثواني)
        let lastAlertTime = 0;
        const VIDEO_RECORD_DURATION_MS = 5000; // مدة تسجيل الفيديو (5 ثواني)

        // ==========================================
        // دوال مساعدة (Logging & UI)
        // ==========================================
        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString('en-GB');
            entry.textContent = `[${time}] ${message}`;
            statusLog.insertBefore(entry, statusLog.firstChild);
        }

        sensitivitySlider.addEventListener('input', (e) => {
            sensitivityThreshold = parseInt(e.target.value);
            sensValDisplay.textContent = sensitivityThreshold;
        });

        // ==========================================
        // تهيئة الكاميرا وبدء النظام
        // ==========================================
        async function startCamera() {
            try {
                log("جاري طلب إذن الكاميرا...", "info");
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        frameRate: { ideal: 30 }
                    }, 
                    audio: false 
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    log("تم تشغيل الكاميرا بنجاح.", "success");
                    // ضبط حجم الـ Canvas الرئيسي ليتناسب مع الفيديو
                    mainCanvas.width = video.videoWidth;
                    mainCanvas.height = video.videoHeight;
                    
                    startMonitoring();
                };
            } catch (err) {
                log(`خطأ في الوصول للكاميرا: ${err.message}`, "alert");
                stopMonitoring();
            }
        }

        // ==========================================
        // حلقة الكشف عن الحركة (Core Logic)
        // ==========================================
        function detectMotion() {
            if (!isMonitoring || video.paused || video.ended) return;

            // 1. رسم الفيديو الحالي على الـ Canvas الرئيسي للعرض
            mainCtx.drawImage(video, 0, 0, mainCanvas.width, mainCanvas.height);

            // 2. رسم نسخة مصغرة للمعالجة (لتحسين الأداء)
            processCtx.drawImage(video, 0, 0, processWidth, processHeight);
            const currentFrameData = processCtx.getImageData(0, 0, processWidth, processHeight);
            
            // إذا كان هذا هو الإطار الأول، نحفظه كمرجع ونعود
            if (previousFrameData === null) {
                previousFrameData = currentFrameData;
                animationId = requestAnimationFrame(detectMotion);
                return;
            }

            // 3. مقارنة الإطارات (Pixel Differencing)
            let changedPixels = 0;
            const dataLength = currentFrameData.data.length;
            const threshold = 30; // الحد الأدنى لتغير لون البكسل ليُحسب كتغيير (لتجاهل الضوضاء)

            // نقفز كل 4 بايت (R,G,B,A)
            for (let i = 0; i < dataLength; i += 4) {
                // مقارنة بسيطة لقيم RGB
                const rDiff = Math.abs(currentFrameData.data[i] - previousFrameData.data[i]);
                const gDiff = Math.abs(currentFrameData.data[i+1] - previousFrameData.data[i+1]);
                const bDiff = Math.abs(currentFrameData.data[i+2] - previousFrameData.data[i+2]);

                if (rDiff + gDiff + bDiff > threshold) {
                    changedPixels++;
                    // اختياري: يمكن رسم نقاط حمراء على الـ mainCanvas هنا لتوضيح الحركة بدقة
                }
            }

            // حساب نسبة التغيير
            const totalPixels = processWidth * processHeight;
            const changeScore = (changedPixels / totalPixels) * 1000; // رقم تقريبي للحركة

            // 4. التحقق من تجاوز عتبة الحساسية
            // ملاحظة: المنزلق يعطي قيمة عكسية (قيمة أقل = حساسية أعلى)
            // لذا نقارن: إذا كانت الدرجة أعلى من (حد أقصى - قيمة المنزلق)
            const triggerPoint = (105 - sensitivityThreshold); 

            const now = Date.now();
            // الشرط: يوجد حركة قوية + لسنا في حالة معالجة تنبيه + انتهت فترة التهدئة
            if (changeScore > triggerPoint && !isProcessingAlert && (now - lastAlertTime > COOLDOWN_TIME_MS)) {
                triggerAlert();
            } else {
                alertOverlay.style.opacity = 0;
            }

            // تحديث الإطار السابق
            previousFrameData = currentFrameData;
            
            // تكرار الحلقة
            animationId = requestAnimationFrame(detectMotion);
        }


        // ==========================================
        // نظام التنبيه والإرسال لتيليجرام
        // ==========================================
        async function triggerAlert() {
            isProcessingAlert = true;
            lastAlertTime = Date.now();
            
            log(">>> تم اكتشاف حركة! <<<", "alert");
            alertOverlay.style.opacity = 1; // وميض أحمر

            // 1. التقاط وإرسال الصورة فوراً
            try {
                log("جاري التقاط وإرسال الصورة...", "info");
                // تحويل محتوى الـ Canvas الحالي إلى Blob (صورة)
                mainCanvas.toBlob(async (blob) => {
                    if (blob) {
                        await sendToTelegram(blob, 'photo');
                    }
                }, 'image/jpeg', 0.9); // جودة 90%

                // 2. بدء تسجيل الفيديو
                startVideoRecording();

            } catch (error) {
                log(`فشل في إجراءات التنبيه: ${error.message}`, "alert");
                isProcessingAlert = false;
            }
        }

        function startVideoRecording() {
            log(`بدء تسجيل فيديو لمدة ${VIDEO_RECORD_DURATION_MS/1000} ثواني...`, "info");
            recordedChunks = [];
            // استخدام الـ stream المباشر من الكاميرا للتسجيل
            // نحاول استخدام كودك متوافق عالمياً مثل H.264 إذا توفر، وإلا الافتراضي
            let options = { mimeType: 'video/webm;codecs=vp9' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = { mimeType: 'video/webm' }; // تراجع للنوع الأساسي
            }

            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                log("لم ينجح إعداد MediaRecorder بالخيارات المفضلة، استخدام الافتراضي.", "info");
                mediaRecorder = new MediaRecorder(stream);
            }

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = async () => {
                log("تم إيقاف التسجيل. جاري معالجة الفيديو وإرساله...", "info");
                // تجميع قطع الفيديو في ملف واحد
                const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
                await sendToTelegram(videoBlob, 'video');
                // السماح بتنبيهات جديدة بعد انتهاء الإرسال
                isProcessingAlert = false;
                log("النظام جاهز للكشف مرة أخرى.", "info");
            };

            mediaRecorder.start();

            // إيقاف التسجيل بعد المدة المحددة تلقائياً
            setTimeout(() => {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                }
            }, VIDEO_RECORD_DURATION_MS);
        }


        // دالة الإرسال العامة لتيليجرام (API POST)
        async function sendToTelegram(blob, type) {
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHAT_ID);
            
            let endpoint = '';
            if (type === 'photo') {
                formData.append('photo', blob, 'motion_capture.jpg');
                formData.append('caption', '🚨 تم اكتشاف حركة! (صورة فورية)');
                endpoint = 'sendPhoto';
            } else if (type === 'video') {
                formData.append('video', blob, 'motion_clip.webm');
                 formData.append('caption', '📹 تسجيل فيديو للحدث.');
                endpoint = 'sendVideo';
            }

            const telegramAPI = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/${endpoint}`;

            try {
                const response = await fetch(telegramAPI, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.ok) {
                    log(`تم إرسال ${type === 'photo' ? 'الصورة' : 'الفيديو'} بنجاح!`, "success");
                } else {
                    throw new Error(`Telegram Error: ${data.description}`);
                }
            } catch (error) {
                log(`فشل الإرسال لتيليجرام (${type}): ${error.message}`, "alert");
            }
        }


        // ==========================================
        // التحكم في حالة النظام (Start/Stop)
        // ==========================================
        function startMonitoring() {
            if (isMonitoring) return;
            isMonitoring = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            log(">>> بدأ نظام المراقبة <<<", "success");
            previousFrameData = null;
            detectMotion();
        }

        function stopMonitoring() {
            if (!isMonitoring) return;
            isMonitoring = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            alertOverlay.style.opacity = 0;
            log("تم إيقاف المراقبة.", "info");

            if (animationId) cancelAnimationFrame(animationId);
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
        }

        // مستمعات الأحداث للأزرار
        startBtn.addEventListener('click', startCamera);
        stopBtn.addEventListener('click', stopMonitoring);

        // رسالة ترحيب عند التحميل
        log("النظام جاهز. اضغط على 'بدء المراقبة' لتفعيل الكاميرا.", "info");

    </script>
</body>
</html>
